<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Practice Glade</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%226%22 fill=%22%23ffb36b%22/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud" hidden><span id="lanterns">0 / 5</span></div>
    <div id="joystick" hidden><div id="stick"></div></div>
    <div id="fps" hidden></div>
    <button id="start">
      <span class="title">Practice Glade</span>
      <span class="tagline">Five lanterns are hidden in the valley.</span>
      <span class="controls">
        <span class="for-mouse">WASD + drag to look &middot; Shift to run &middot; Space to jump</span>
        <span class="for-touch">Joystick + drag to look</span>
      </span>
      <span class="hint">Tap to start</span>
      <span class="credits">Character: KayKit &middot; Trees &amp; plants: Quaternius &middot; all CC0</span>
    </button>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
